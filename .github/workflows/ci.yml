name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: host tests + JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure-logic modules compile and run on the host (no Pebble SDK needed),
      # covering layout, calendar, suntimes, time/date formatting, vibes and the
      # clock-font selection. Single host-test flag set, identical to Makefile /
      # justfile / tools/test.sh. The full per-platform SDK build + warning-strict
      # compile run in the `arm` job below (and locally via tools/test.sh).
      - name: Host unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Isrc -Itests tests/test_*.c \
            src/layout.c src/calendar.c src/suntimes.c src/timefmt.c src/vibes.c src/math.c \
            src/complications.c src/settings.c src/locale.c \
            -lm -o timely_utest
          ./timely_utest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Version single-source: package.json is authoritative; fail if the
      # src/splash.c APP_VERSION drifts from it.
      - name: Version single-source check
        run: sh tools/check-version.sh

      # The AK_* #defines in src/Timely.c must be a bijection with package.json
      # messageKeys (the three config layers have to agree).
      - name: App-key bijection check
        run: sh tools/check-appkeys.sh

      - name: PebbleKit JS syntax check
        run: |
          for f in src/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      # Wire-contract round-trip tests (configpage -> app.js): the T4 codec/
      # coverage checks and the T2 settings-loss regressions that drive the real
      # webviewclosed handler. Fails CI on any settings-loss regression.
      - name: JS round-trip tests
        run: node --test tests/js/

  arm:
    name: ARM build + strict compile (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The flake pins pebble.nix at pebble-tool 5.0.35, but the current SDK
      # declares "pebble-tool>=5.0.38" and `pebble sdk install latest` aborts at
      # the extract step. Install the tool from PyPI instead; the SDK brings its
      # own ARM toolchain. flake.nix remains the local development path.
      - name: Install pebble-tool
        run: |
          pipx install pebble-tool
          pebble --version

      # binutils-arm-none-eabi provides arm-none-eabi-readelf for reloc-check
      # and arm-none-eabi-gcc for strict-check.
      - name: Install ARM toolchain utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-none-eabi gcc-arm-none-eabi

      # The SDK is a large download pebble.nix does not provide; cache it across
      # runs keyed on the flake lock so a lockfile bump refetches.
      - name: Cache Pebble SDK
        uses: actions/cache@v4
        with:
          path: ~/.pebble-sdk
          key: pebble-sdk-${{ runner.os }}-v1
          restore-keys: pebble-sdk-${{ runner.os }}-

      - name: Install Pebble SDK (first run / cache miss)
        run: |
          if [ ! -d "$HOME/.pebble-sdk/SDKs/current" ]; then
            pebble sdk install latest
          else
            echo "SDK restored from cache"
          fi

      # Real per-platform build (all 4 targets from package.json). Also generates
      # the per-platform headers that strict-check reuses.
      - name: Build (all platforms)
        run: pebble build

      # Guards the misaligned-relocation class that shipped an unlaunchable 0.0.7.
      # Runs only when the script exists so the workflow also passes on refs that
      # predate it (the script is currently absent — tracked separately).
      - name: Relocation alignment check
        run: |
          if [ -f tools/reloc-check.sh ]; then
            sh tools/reloc-check.sh
          else
            echo "::warning::tools/reloc-check.sh absent on this ref - skipping"
          fi

      # Compile every source per platform under the exact cloud -Werror flag set;
      # fails on any error OR warning. A hard gate now that the -Wno-error debt is
      # paid (flake.nix no longer exports -Wno-error).
      - name: Strict per-platform compile (cloud flags)
        run: sh tools/strict-check.sh
