name: Build & Release

# Fires on EVERY push (any branch) plus manual dispatch, per project convention.
# No `pull_request` trigger: it would double-run for branch pushes and would
# publish release artifacts from unreviewed forks.
#
# Pipeline: test -> build -> release. `build` depends on `test` (needs:), so a
# red test suite physically cannot produce a .pbw.
#
# NOTE ON THE APPSTORE: the Rebble developer portal has NO public upload API —
# publishing is a manual web upload of the .pbw ("Add a release" -> "Publish").
# A store release is also only accepted when its version is strictly greater
# than every previously published one, so "publish on every push" is not
# expressible against that store even in principle. What this workflow does
# instead: every push produces a downloadable, versioned .pbw, and a push of a
# v* tag produces a GitHub Release with the .pbw attached, ready to upload.
# See STORE.md for the (short) manual step.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # create releases and upload the .pbw asset

jobs:
  test:
    name: host tests + JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure-logic modules compile and run on the host (no Pebble SDK needed).
      # Flags match tools/test.sh so local and CI see the same warnings.
      - name: Host unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Isrc -Itests tests/test_*.c \
            src/layout.c src/calendar.c src/suntimes.c src/timefmt.c \
            src/vibes.c src/math.c \
            -lm -o timely_utest
          ./timely_utest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: PebbleKit JS syntax check
        run: |
          for f in src/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

  build:
    name: build .pbw (all platforms)
    runs-on: ubuntu-latest
    needs: test # <- no green tests, no binary
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The flake pins pebble.nix at pebble-tool 5.0.35, but the current SDK
      # declares "pebble-tool>=5.0.38" and `pebble sdk install latest` aborts at
      # the extract step. Install the tool from PyPI instead; the SDK brings its
      # own ARM toolchain. flake.nix remains the local development path.
      - name: Install pebble-tool
        run: |
          pipx install pebble-tool
          pebble --version

      # binutils-arm-none-eabi provides arm-none-eabi-readelf for reloc-check
      # and arm-none-eabi-gcc for strict-check.
      - name: Install ARM toolchain utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-none-eabi gcc-arm-none-eabi

      # The SDK is a large download that pebble.nix does not provide; cache it
      # across runs keyed on the flake lock so a lockfile bump refetches.
      - name: Cache Pebble SDK
        uses: actions/cache@v4
        with:
          path: ~/.pebble-sdk
          key: pebble-sdk-${{ runner.os }}-v1
          restore-keys: pebble-sdk-${{ runner.os }}-

      - name: Install Pebble SDK (first run / cache miss)
        run: |
          if [ ! -d "$HOME/.pebble-sdk/SDKs/current" ]; then
            pebble sdk install latest
          else
            echo "SDK restored from cache"
          fi

      - name: Read version from package.json
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pebble build

      # Guards the class of defect that shipped a completely unlaunchable 0.0.7:
      # an address-valued initializer inside a packed struct emits a misaligned
      # R_ARM_ABS32 that the PebbleOS loader rejects at launch. Skipped when the
      # script is absent so the workflow also runs on branches predating it.
      - name: Relocation alignment check
        run: |
          if [ -f tools/reloc-check.sh ]; then
            sh tools/reloc-check.sh
          else
            echo "::warning::tools/reloc-check.sh absent on this ref - skipping"
          fi

      # Hard gate now that the -Wno-error debt is paid (flake.nix no longer
      # exports -Wno-error and tests/test_layout.c is -Wextra clean).
      - name: Strict per-platform compile (cloud flags)
        run: sh tools/strict-check.sh

      - name: Upload .pbw
        uses: actions/upload-artifact@v4
        with:
          name: TimelyNG-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: build/*.pbw
          if-no-files-found: error

  release:
    name: GitHub Release (tags only)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TimelyNG-*
          merge-multiple: true

      - name: Publish release with the .pbw attached
        uses: softprops/action-gh-release@v2
        with:
          files: "*.pbw"
          generate_release_notes: true
          body: |
            Built from ${{ github.sha }}.

            The `.pbw` below is the artifact to upload to the Rebble developer
            portal — that upload is manual, the portal exposes no API. See STORE.md.
